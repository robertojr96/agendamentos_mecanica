apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mecanica
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
      - name: backend
        image: backend:local
        imagePullPolicy: Never
        envFrom:
        - secretRef:
            name: postgres-secret
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mecanica
spec:
  selector: { app: backend }
  ports:
  - port: 3000
    targetPort: 3000

